[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truthrail-core"
version = "0.5.0"
description = "Truthrail: portable GitHub-native protocol and reference implementation for AI work continuity and routing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Truthrail Core contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
]

[project.scripts]
truthrail = "truthrail_core.cli:main"

[tool.setuptools.packages.find]
include = ["truthrail_core*"]

[tool.setuptools.package-data]
"truthrail_core.schemas.v0_1" = ["*.json"]
"truthrail_core.schemas.v0_2" = ["*.json"]
